name: Build & Release

# Builds Windows, Linux and Web exports with Godot and publishes them.
#   • Push a tag like `v1.0.0`  -> builds + attaches the zips to a GitHub Release
#     (keeps large binaries OUT of the git repo — they live on the Release).
#   • Run manually (workflow_dispatch) -> builds + uploads the zips as
#     downloadable workflow artifacts (no Release is created).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.4.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }} + export templates
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo install -m 755 "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          mv templates/* "$dest/"
          godot --version

      - name: Import project (build the .godot cache)
        run: godot --headless --editor --import --path . || true

      - name: Export builds
        run: |
          set -euo pipefail
          mkdir -p dist/windows dist/linux dist/web
          godot --headless --path . --export-release "Windows Desktop" dist/windows/EmpiresOfOlympus.exe
          godot --headless --path . --export-release "Linux"           dist/linux/EmpiresOfOlympus.x86_64
          godot --headless --path . --export-release "Web"             dist/web/index.html
          chmod +x dist/linux/EmpiresOfOlympus.x86_64

      - name: Package archives
        run: |
          set -euo pipefail
          cd dist
          (cd windows && zip -qr ../EmpiresOfOlympus-windows.zip .)
          (cd linux   && zip -qr ../EmpiresOfOlympus-linux.zip .)
          (cd web     && zip -qr ../EmpiresOfOlympus-web.zip .)
          ls -la ./*.zip

      - name: Upload build artifacts (for manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: EmpiresOfOlympus-builds
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
